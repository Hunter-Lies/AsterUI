<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AsterUI</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: transparent; overflow: hidden; }
    body { font: 14px/1.4 "Segoe UI", sans-serif; color: #f5f7fb; }
    #root { position: absolute; left: 28px; bottom: 28px; padding: 12px 16px; border: 1px solid rgba(255,255,255,.28); background: rgba(12,18,28,.78); }
    #status { color: #8ee8c0; }
  </style>
</head>
<body>
  <div id="root">
    <strong>AsterUI</strong>
    <div id="status">waiting for bridge</div>
  </div>
  <script>
    window.addEventListener("asterui:ready", function () {
      document.getElementById("status").textContent = "bridge ready";
      window.asterui.emit("asterui:smoke", { ok: true });
    });
  </script>
</body>
</html>
