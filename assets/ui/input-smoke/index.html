<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AsterUI Input Smoke</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #16202b; color: #fff; }
    body { font: 16px/1.4 "Segoe UI", sans-serif; }
    #surface {
      position: absolute;
      inset: 24px;
      display: grid;
      place-items: center;
      border: 2px solid #d28a3a;
      background: #213242;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <div id="surface">input smoke surface</div>
  <script>
    (function () {
      "use strict";
      function report(kind, event, extra) {
        if (!window.asterui) return;
        window.asterui.emit("asterui:input", Object.assign({
          kind: kind,
          x: event.clientX,
          y: event.clientY
        }, extra || {}));
      }
      var surface = document.getElementById("surface");
      var down = false;
      surface.addEventListener("pointerdown", function (event) {
        down = true;
        report("down", event, { button: event.button });
      });
      surface.addEventListener("pointerup", function (event) {
        down = false;
        report("up", event, { button: event.button });
      });
      surface.addEventListener("click", function (event) {
        report("click", event, { detail: event.detail });
      });
      surface.addEventListener("pointermove", function (event) {
        report(down ? "drag" : "move", event, { buttons: event.buttons });
      });
      surface.addEventListener("wheel", function (event) {
        event.preventDefault();
        report("wheel", event, {
          deltaX: event.deltaX,
          deltaY: event.deltaY
        });
      }, { passive: false });
    })();
  </script>
</body>
</html>
