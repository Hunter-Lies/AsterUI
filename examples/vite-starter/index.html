<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AsterUI Vite Starter</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <style>
    body {
      display: grid;
      place-items: center;
    }

    .panel {
      width: min(560px, calc(100vw - 48px));
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    p {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.6;
    }

    button {
      padding: 9px 13px;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Vite HMR inside AsterUI</h1>
    <p>
      Run <code>npm run dev</code>, add
      <code>http://127.0.0.1:5173</code> to the development allow list, then
      navigate an AsterUI browser to this page.
    </p>
    <button id="send" type="button">Send event</button>
  </main>
  <script type="module">
    import "../../sdk/js/mock.js";
    import "../_shared/bridge.js";

    window.addEventListener("asterui:ready", () => {
      document.getElementById("send").addEventListener("click", () => {
        window.asterui.emit("vite:event", { at: Date.now() });
      });
    });
  </script>
</body>
</html>
