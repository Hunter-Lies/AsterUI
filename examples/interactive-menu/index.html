<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AsterUI Interactive Menu</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <style>
    body {
      display: grid;
      place-items: center;
    }

    .shell {
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr);
      width: min(760px, calc(100vw - 56px));
      min-height: 390px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    nav {
      padding: 16px;
      border-right: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.025);
    }

    nav h1 {
      margin: 4px 8px 18px;
      font-size: 15px;
    }

    .tab {
      width: 100%;
      margin-bottom: 5px;
      padding: 9px 10px;
      border-color: transparent;
      background: transparent;
      color: var(--muted);
      text-align: left;
    }

    .tab.active {
      border-color: rgba(125, 189, 163, 0.25);
      background: rgba(125, 189, 163, 0.1);
      color: var(--text);
    }

    main {
      padding: 24px;
    }

    h2 {
      margin: 0 0 7px;
      font-size: 22px;
    }

    .lead {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .rows {
      display: grid;
      gap: 9px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.025);
    }

    .row small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
    }

    .switch {
      position: relative;
      flex: none;
      width: 38px;
      height: 21px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--muted);
      transition: transform 180ms ease, background 180ms ease;
    }

    .switch.on {
      border-color: rgba(125, 189, 163, 0.42);
      background: rgba(125, 189, 163, 0.18);
    }

    .switch.on::after {
      transform: translateX(17px);
      background: var(--accent);
    }
  </style>
</head>
<body>
  <section class="shell">
    <nav>
      <h1>AsterUI Example</h1>
      <button class="tab active" type="button" data-pane="general">General</button>
      <button class="tab" type="button" data-pane="interface">Interface</button>
      <button class="tab" type="button" data-pane="events">Events</button>
    </nav>
    <main>
      <h2 id="title">General</h2>
      <p class="lead" id="lead">A minimal, keyboard and pointer friendly settings surface.</p>
      <div class="rows">
        <label class="row">
          <span>Enable overlay<small>Toggle a sample interface setting.</small></span>
          <button class="switch on" type="button" aria-label="Enable overlay"></button>
        </label>
        <label class="row">
          <span>Compact layout<small>Use the smaller spacing profile.</small></span>
          <button class="switch" type="button" aria-label="Compact layout"></button>
        </label>
        <label class="row">
          <span>Event logging<small>Emit bridge events to the host.</small></span>
          <button class="switch on" type="button" aria-label="Event logging"></button>
        </label>
      </div>
    </main>
  </section>
  <span class="bridge-state" id="bridge">waiting for bridge</span>
  <script src="../../sdk/js/mock.js"></script>
  <script src="../_shared/bridge.js"></script>
  <script>
    (function () {
      var content = {
        general: ["General", "A minimal, keyboard and pointer friendly settings surface."],
        interface: ["Interface", "Controls use predictable hit areas and transition states."],
        events: ["Events", "Use asterui.emit for actions and asterui.on for host state."]
      };
      var title = document.getElementById("title");
      var lead = document.getElementById("lead");
      var bridge = document.getElementById("bridge");

      document.querySelectorAll(".tab").forEach(function (tab) {
        tab.addEventListener("click", function () {
          document.querySelectorAll(".tab").forEach(function (item) {
            item.classList.toggle("active", item === tab);
          });
          var pane = tab.dataset.pane;
          title.textContent = content[pane][0];
          lead.textContent = content[pane][1];
          AsterDemo.emit("menu:tab", { pane: pane });
        });
      });

      document.querySelectorAll(".switch").forEach(function (toggle) {
        toggle.addEventListener("click", function () {
          toggle.classList.toggle("on");
          AsterDemo.emit("menu:toggle", {
            label: toggle.getAttribute("aria-label"),
            value: toggle.classList.contains("on")
          });
        });
      });

      AsterDemo.onReady(function () {
        bridge.textContent = "bridge ready";
        bridge.classList.add("ready");
      });
    })();
  </script>
</body>
</html>
